name: ml-workflow

on:
  pull_request:
    paths:
      - plugins/ml-workflow/**
      - .claude-plugin/marketplace.json
      - .github/workflows/ml-workflow.yml
      - scripts/plugin-version*
  push:
    branches: [main]
    paths:
      - plugins/ml-workflow/**
      - .claude-plugin/marketplace.json
      - .github/workflows/ml-workflow.yml
      - scripts/plugin-version*

permissions:
  contents: read

jobs:
  helper:
    name: claude-spore (bun test, spore ${{ matrix.spore }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported spore, SPORE_MINIMUM in src/version.ts, and the newest release
        # (docs/spec.md, Testing).
        spore: ["0.4.0", latest]
    steps:
      - uses: actions/checkout@v4
      # runspore's installer checks the release key's signature on SHA256SUMS and the archive's
      # checksum; an empty SPORE_VERSION picks the newest release.
      - name: Install spore
        run: curl -fsSL https://raw.githubusercontent.com/Web-tree/runspore/main/install.sh | sh
        env:
          SPORE_VERSION: ${{ matrix.spore != 'latest' && matrix.spore || '' }}
          SPORE_INSTALL_DIR: ${{ runner.temp }}/spore
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test plugins/ml-workflow/test
        env:
          SPORE: ${{ runner.temp }}/spore/spore
          REQUIRE_SPORE: "1"

  old-bun:
    name: claude-spore refuses Bun 1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - name: exits 2 naming the version needed
        run: |
          set +e
          out=$(plugins/ml-workflow/bin/claude-spore --version 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          grep -q 'needs Bun 1.2.0 or later; this is Bun 1.1.38' <<<"$out"

  mod:
    name: mod registration (claude plugin test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate plugins/ml-workflow
      - run: claude plugin test plugins/ml-workflow

  version:
    name: version raised
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test ./scripts/
      # `claude plugin update` compares versions only: a change merged at the old version never
      # reaches an installed copy (skills#115). Against the base branch's tip, so two pull
      # requests that raise it to the same version cannot both merge. A pull request is checked out
      # as its merge commit, whose first parent is that tip.
      - run: bun scripts/plugin-version.ts check ml-workflow "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}

  naming:
    name: plugin naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-naming.sh
