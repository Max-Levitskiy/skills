name: ml-workflow

on:
  pull_request:
    paths:
      - plugins/ml-workflow/**
      - .claude-plugin/marketplace.json
      - .github/workflows/ml-workflow.yml
  push:
    branches: [main]
    paths:
      - plugins/ml-workflow/**
      - .claude-plugin/marketplace.json
      - .github/workflows/ml-workflow.yml

permissions:
  contents: read

env:
  # The helper's specs run against spore built from this commit (docs/spec.md, Testing): the
  # v0.2.0 tag predates async commands (Web-tree/runspore#71), which the interactive step needs,
  # and `continue --wait` and `cancel` (#73, #74), which following and cancelling a run need.
  # Replace with the newest release and the oldest supported one once a release has them.
  RUNSPORE_REF: 814764512eab0da8de936c30ce698e40079474bb

jobs:
  helper:
    name: claude-spore (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Web-tree/runspore
          ref: ${{ env.RUNSPORE_REF }}
          path: runspore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runspore
      # The first cargo call installs the toolchain runspore's rust-toolchain.toml pins.
      - name: Build spore
        working-directory: runspore
        run: cargo build --release --locked -p runspore-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test plugins/ml-workflow/test
        env:
          SPORE: ${{ github.workspace }}/runspore/target/release/spore
          REQUIRE_SPORE: "1"

  old-bun:
    name: claude-spore refuses Bun 1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - name: exits 2 naming the version needed
        run: |
          set +e
          out=$(plugins/ml-workflow/bin/claude-spore --version 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          grep -q 'needs Bun 1.2.0 or later; this is Bun 1.1.38' <<<"$out"

  mod:
    name: mod registration (claude plugin test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate plugins/ml-workflow
      - run: claude plugin test plugins/ml-workflow

  naming:
    name: plugin naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-naming.sh
